name: Check

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  guidance:
    name: Check guidance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up Task
        uses: go-task/setup-task@v2
        with:
          version: "3.x"

      - name: Check guidance
        run: task check:guidance
